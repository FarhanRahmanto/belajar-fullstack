<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Commerce Card</title>
  <link rel="stylesheet" href="style-tantangan1.css">
</head>
<body>
  <article class="container-utama">
    <div class="container-foto">
      <img class="icon-gambar" src="sepatu.jpg" alt="sepatu">
    </div>
    <div class="container-detail">
      <h1 id="title">HYPERBLAST 3.0 W</h1>
      <h2 id="seri">SEAFORM GREEN</h2>
      <h2 id="price">IDR 726,530</h2>
      <p class="description">DESCRIPTION</p>
      <P class="description">SIZE CHART</P>
        <div class="container-size">
          <button>39</button>
          <button>40</button>
          <button>41</button>
        </div>
      <p class="description">PRODUCT SPECIFICATION</p>
    </div>
    <div class="container-button">
      <div class="container-nambahItem">
        <p>-</p>
        <p>1</p>
        <p>+</p>
      </div>
      <div class="container-x">
        <button>x</button>
      </div>
    </div>
  </article>
  <script src="srcipt.js"></script>
</body>
</html>
